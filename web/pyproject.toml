[project]
name = "sigem-web"
version = "0.1.0"
description = "Servidor Flask que muestra las pantallas de SIGEM (ADR-0004)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert es normal en tests

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
