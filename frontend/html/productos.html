<!doctype html>
<html lang="es">
  <head>
    <!-- Datos de la página: idioma, tamaño en el celular/PC y título de la pestaña -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos · SIGEM</title>
    <!-- Estilos de SIGEM: colores, letras y componentes del diseño de Figma -->
    <link rel="stylesheet" href="css/sigem.css" />
    <!-- Código JavaScript de esta pantalla -->
    <script type="module" src="js/productos.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Menú lateral: lo dibuja js/shared/layout.js con el usuario de la sesión -->
      <div id="sidebar"></div>
      <div class="app-main">
        <!-- Barra superior: título de la pantalla y sus botones (también la dibuja layout.js) -->
        <div id="topbar"></div>
        <main class="app-content">
          <!-- Aviso de la página: aparece al guardar o al usar algo que aún no está conectado -->
          <div class="alert page-alert" id="page-alert" role="status" hidden></div>
          <!-- Tarjeta con el buscador, los filtros y la tabla de productos -->
          <section class="card">
            <!-- Buscador y filtros de la lista -->
            <div class="card-toolbar">
              <div class="search-input-wrap toolbar-search">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  class="form-input"
                  type="search"
                  placeholder="Buscar por nombre o proveedor..."
                  aria-label="Buscar productos"
                />
              </div>
              <!-- Botones de filtro: el azul es el que está aplicado -->
              <div class="chips" role="group" aria-label="Filtrar">
                <button class="chip active" type="button" aria-pressed="true">Todos</button
                ><button class="chip" type="button" aria-pressed="false">Activo</button
                ><button class="chip" type="button" aria-pressed="false">Inactivo</button>
              </div>
            </div>
            <!-- Tabla del listado: las filas llegan del backend cuando el módulo tenga API -->
            <table class="table-base" aria-label="Productos">
              <thead>
                <tr>
                  <th scope="col">Nombre</th>
                  <th scope="col">Proveedor</th>
                  <th scope="col">Precio de venta</th>
                  <th scope="col">IVA</th>
                  <th scope="col">Stock</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-row">
                  <td colspan="7">Aún no hay productos registrados</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
    <!-- Modal de nuevo producto: el IVA es por producto (0, 5 o 19 %) y el stock nunca es negativo -->
    <div class="modal-overlay" id="modal-producto" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-producto-title">
        <!-- Encabezado del modal con el botón X para cerrar -->
        <div class="modal-header">
          <h2 class="modal-title" id="modal-producto-title">Nuevo producto</h2>
          <button class="btn-icon" type="button" data-close aria-label="Cerrar">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <!-- Formulario: los campos con * son obligatorios -->
        <form class="modal-body" id="form-producto" novalidate>
          <div class="form-grid">
            <div class="form-group span-2">
              <label class="form-label" for="nombre"
                >Nombre del producto<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="nombre"
                name="nombre"
                type="text"
                placeholder="Resma papel carta 500 hojas"
                required
                data-error="El nombre es obligatorio"
                aria-describedby="nombre-error"
              />
              <div class="form-error" id="nombre-error" hidden></div>
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="id_proveedor"
                >Proveedor<span class="form-required" aria-hidden="true">*</span></label
              >
              <select
                class="form-input select-input"
                id="id_proveedor"
                name="id_proveedor"
                required
                data-error="Elige un proveedor"
                aria-describedby="id_proveedor-error"
              >
                <option value="">Primero registra un proveedor</option>
              </select>
              <div class="form-error" id="id_proveedor-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="precio_compra"
                >Precio de compra<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="precio_compra"
                name="precio_compra"
                type="number"
                placeholder="20000"
                required
                data-error="El precio de compra es obligatorio"
                min="0"
                step="0.01"
                data-min-error="El precio no puede ser negativo"
                aria-describedby="precio_compra-error"
              />
              <div class="form-error" id="precio_compra-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="precio_venta"
                >Precio de venta<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="precio_venta"
                name="precio_venta"
                type="number"
                placeholder="28500"
                required
                data-error="El precio de venta es obligatorio"
                min="0"
                step="0.01"
                data-min-error="El precio no puede ser negativo"
                aria-describedby="precio_venta-error"
              />
              <div class="form-error" id="precio_venta-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="porcentaje_iva"
                >IVA<span class="form-required" aria-hidden="true">*</span></label
              >
              <select
                class="form-input select-input"
                id="porcentaje_iva"
                name="porcentaje_iva"
                required
                data-error="Elige la tarifa de IVA"
                aria-describedby="porcentaje_iva-error"
              >
                <option value="">Seleccionar...</option>
                <option>0 %</option>
                <option>5 %</option>
                <option>19 %</option>
              </select>
              <div class="form-error" id="porcentaje_iva-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="stock"
                >Stock inicial<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="stock"
                name="stock"
                type="number"
                placeholder="45"
                required
                data-error="El stock es obligatorio"
                min="0"
                step="1"
                data-min-error="El stock no puede ser negativo"
                aria-describedby="stock-error"
              />
              <div class="form-error" id="stock-error" hidden></div>
            </div>
          </div>
          <!-- Botones: Cancelar cierra el modal, Guardar valida y envía -->
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close>Cancelar</button>
            <button class="btn-primary" type="submit">Guardar producto</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
