<!doctype html>
<html lang="es">
  <head>
    <!-- Datos de la página: idioma, tamaño en el celular/PC y título de la pestaña -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proveedores · SIGEM</title>
    <!-- Estilos de SIGEM: colores, letras y componentes del diseño de Figma -->
    <link rel="stylesheet" href="css/sigem.css" />
    <!-- Código JavaScript de esta pantalla -->
    <script type="module" src="js/proveedores.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Menú lateral: lo dibuja js/shared/layout.js con el usuario de la sesión -->
      <div id="sidebar"></div>
      <div class="app-main">
        <!-- Barra superior: título de la pantalla y sus botones (también la dibuja layout.js) -->
        <div id="topbar"></div>
        <main class="app-content">
          <!-- Aviso de la página: aparece al guardar o al usar algo que aún no está conectado -->
          <div class="alert page-alert" id="page-alert" role="status" hidden></div>
          <!-- Proveedores no está en el prototipo: usa el mismo patrón de lista (DESIGN.md §4) -->
          <section class="card">
            <!-- Buscador y filtros de la lista -->
            <div class="card-toolbar">
              <div class="search-input-wrap toolbar-search">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  class="form-input"
                  type="search"
                  placeholder="Buscar por razón social, documento o ciudad..."
                  aria-label="Buscar proveedores"
                />
              </div>
              <!-- Botones de filtro: el azul es el que está aplicado -->
              <div class="chips" role="group" aria-label="Filtrar">
                <button class="chip active" type="button" aria-pressed="true">Todos</button
                ><button class="chip" type="button" aria-pressed="false">Activo</button
                ><button class="chip" type="button" aria-pressed="false">Inactivo</button>
              </div>
            </div>
            <!-- Tabla del listado: las filas llegan del backend cuando el módulo tenga API -->
            <table class="table-base" aria-label="Proveedores">
              <thead>
                <tr>
                  <th scope="col">Razón social</th>
                  <th scope="col">Documento</th>
                  <th scope="col">Contacto</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Teléfono</th>
                  <th scope="col">Ciudad</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-row">
                  <td colspan="8">Aún no hay proveedores registrados</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
    <!-- Modal de nuevo proveedor con los campos de la tabla proveedores -->
    <div class="modal-overlay" id="modal-proveedor" hidden>
      <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-proveedor-title"
      >
        <!-- Encabezado del modal con el botón X para cerrar -->
        <div class="modal-header">
          <h2 class="modal-title" id="modal-proveedor-title">Nuevo proveedor</h2>
          <button class="btn-icon" type="button" data-close aria-label="Cerrar">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <!-- Formulario: los campos con * son obligatorios -->
        <form class="modal-body" id="form-proveedor" novalidate>
          <div class="form-grid">
            <div class="form-group span-2">
              <label class="form-label" for="razon_social"
                >Razón social<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="razon_social"
                name="razon_social"
                type="text"
                placeholder="Distribuidora Andina S.A.S"
                required
                data-error="La razón social es obligatoria"
                aria-describedby="razon_social-error"
              />
              <div class="form-error" id="razon_social-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="tipo_documento"
                >Tipo de documento<span class="form-required" aria-hidden="true">*</span></label
              >
              <select
                class="form-input select-input"
                id="tipo_documento"
                name="tipo_documento"
                required
                data-error="Elige el tipo de documento"
                aria-describedby="tipo_documento-error"
              >
                <option value="">Seleccionar...</option>
                <option>NIT</option>
                <option>Cédula de ciudadanía</option>
                <option>Cédula de extranjería</option>
              </select>
              <div class="form-error" id="tipo_documento-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="documento_id"
                >Número de documento<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="documento_id"
                name="documento_id"
                type="text"
                placeholder="900.987.654-3"
                required
                data-error="El documento es obligatorio"
                aria-describedby="documento_id-error"
              />
              <div class="form-error" id="documento_id-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="nombre_contacto"
                >Nombre del contacto<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="nombre_contacto"
                name="nombre_contacto"
                type="text"
                placeholder="Laura Méndez"
                required
                data-error="El contacto es obligatorio"
                aria-describedby="nombre_contacto-error"
              />
              <div class="form-error" id="nombre_contacto-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="email"
                >Correo electrónico<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="email"
                name="email"
                type="email"
                placeholder="ventas@proveedor.co"
                required
                data-error="El correo es obligatorio"
                aria-describedby="email-error"
              />
              <div class="form-error" id="email-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="telefono"
                >Teléfono<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="telefono"
                name="telefono"
                type="tel"
                placeholder="601 345 6789"
                required
                data-error="El teléfono es obligatorio"
                aria-describedby="telefono-error"
              />
              <div class="form-error" id="telefono-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="ciudad"
                >Ciudad<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="ciudad"
                name="ciudad"
                type="text"
                placeholder="Medellín"
                required
                data-error="La ciudad es obligatoria"
                aria-describedby="ciudad-error"
              />
              <div class="form-error" id="ciudad-error" hidden></div>
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="direccion"
                >Dirección<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="direccion"
                name="direccion"
                type="text"
                placeholder="Carrera 50 # 30-15"
                required
                data-error="La dirección es obligatoria"
                aria-describedby="direccion-error"
              />
              <div class="form-error" id="direccion-error" hidden></div>
            </div>
          </div>
          <!-- Botones: Cancelar cierra el modal, Guardar valida y envía -->
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close>Cancelar</button>
            <button class="btn-primary" type="submit">Guardar proveedor</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
