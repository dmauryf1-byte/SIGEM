<!doctype html>
<html lang="es">
  <head>
    <!-- Datos de la página: idioma, tamaño en el celular/PC y título de la pestaña -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagos · SIGEM</title>
    <!-- Estilos de SIGEM: colores, letras y componentes del diseño de Figma -->
    <link rel="stylesheet" href="css/sigem.css" />
    <!-- Código JavaScript de esta pantalla -->
    <script type="module" src="js/pagos.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Menú lateral: lo dibuja js/shared/layout.js con el usuario de la sesión -->
      <div id="sidebar"></div>
      <div class="app-main">
        <!-- Barra superior: título de la pantalla y sus botones (también la dibuja layout.js) -->
        <div id="topbar"></div>
        <main class="app-content">
          <!-- Aviso de la página: aparece al guardar o al usar algo que aún no está conectado -->
          <div class="alert page-alert" id="page-alert" role="status" hidden></div>
          <!-- Tres cifras de resumen: recaudado, cantidad de pagos y saldo por cobrar -->
          <div class="kpi-grid three">
            <div class="stat-card">
              <div class="kpi-label">Total recaudado</div>
              <div class="kpi-value money-in">$0</div>
            </div>
            <div class="stat-card">
              <div class="kpi-label">Pagos registrados</div>
              <div class="kpi-value money-count">0</div>
            </div>
            <div class="stat-card">
              <div class="kpi-label">Saldo por cobrar</div>
              <div class="kpi-value money-due">$0</div>
            </div>
          </div>
          <!-- Tarjeta con buscador, filtro por método y la tabla de pagos -->
          <section class="card">
            <!-- Buscador y filtros de la lista -->
            <div class="card-toolbar">
              <div class="search-input-wrap toolbar-search">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  class="form-input"
                  type="search"
                  placeholder="Buscar por factura o cliente..."
                  aria-label="Buscar pagos"
                />
              </div>
              <!-- Botones de filtro: el azul es el que está aplicado -->
              <div class="chips" role="group" aria-label="Filtrar">
                <button class="chip active" type="button" aria-pressed="true">Todos</button
                ><button class="chip" type="button" aria-pressed="false">Efectivo</button
                ><button class="chip" type="button" aria-pressed="false">Transferencia</button
                ><button class="chip" type="button" aria-pressed="false">Tarjeta débito</button>
              </div>
            </div>
            <!-- Tabla del listado: las filas llegan del backend cuando el módulo tenga API -->
            <table class="table-base" aria-label="Pagos">
              <thead>
                <tr>
                  <th scope="col">Factura</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Método</th>
                  <th scope="col">Monto</th>
                  <th scope="col">Fecha</th>
                  <th scope="col">Saldo factura</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-row">
                  <td colspan="6">Aún no hay pagos registrados</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
    <!-- Modal para registrar un pago. El monto no puede superar el saldo: lo revisa el backend -->
    <div class="modal-overlay" id="modal-pago" hidden>
      <div
        class="modal-box small"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-pago-title"
      >
        <!-- Encabezado del modal con el botón X para cerrar -->
        <div class="modal-header">
          <h2 class="modal-title" id="modal-pago-title">Registrar pago</h2>
          <button class="btn-icon" type="button" data-close aria-label="Cerrar">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <!-- Formulario: los campos con * son obligatorios -->
        <form class="modal-body" id="form-pago" novalidate>
          <div class="alert alert-info page-alert">
            El pago no puede superar el saldo pendiente de la factura.
          </div>
          <div class="form-grid">
            <div class="form-group span-2">
              <label class="form-label" for="id_factura"
                >Factura<span class="form-required" aria-hidden="true">*</span></label
              >
              <select
                class="form-input select-input"
                id="id_factura"
                name="id_factura"
                required
                data-error="Selecciona una factura"
                aria-describedby="id_factura-error"
              >
                <option value="">No hay facturas pendientes</option>
              </select>
              <div class="form-error" id="id_factura-error" hidden></div>
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="metodo_pago"
                >Método de pago<span class="form-required" aria-hidden="true">*</span></label
              >
              <select
                class="form-input select-input"
                id="metodo_pago"
                name="metodo_pago"
                required
                data-error="Elige el método"
                aria-describedby="metodo_pago-error"
              >
                <option>Efectivo</option>
                <option>Transferencia</option>
                <option>Tarjeta débito</option>
                <option>Tarjeta crédito</option>
                <option>Cheque</option>
              </select>
              <div class="form-error" id="metodo_pago-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="valor"
                >Monto<span class="form-required" aria-hidden="true">*</span></label
              >
              <input
                class="form-input"
                id="valor"
                name="valor"
                type="number"
                placeholder="0"
                required
                data-error="El monto es obligatorio"
                min="1"
                step="0.01"
                data-min-error="El monto debe ser mayor a cero"
                aria-describedby="valor-error"
              />
              <div class="form-error" id="valor-error" hidden></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="referencia">Referencia</label>
              <input
                class="form-input"
                id="referencia"
                name="referencia"
                type="text"
                placeholder="Comprobante o número de transacción"
                aria-describedby="referencia-error"
              />
              <div class="form-error" id="referencia-error" hidden></div>
            </div>
          </div>
          <!-- Botones: Cancelar cierra el modal, Guardar valida y envía -->
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close>Cancelar</button>
            <button class="btn-primary" type="submit">Registrar</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
